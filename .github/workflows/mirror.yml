name: Mirror unduo.me

# https://unduome.github.io/ serves the same files as https://unduo.me/, for networks
# that block newly registered domains, as the University of Toronto's wifi blocks
# unduo.me. This copies www/ from UnDuoMe/unduo.me's main branch, and deploys it
# only once unduo.me itself serves those exact bytes.

on:
  # Another repository's push can't start this without a stored credential,
  # so it checks every ten minutes instead.
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  compare:
    name: Compare with unduo.me
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # GitHub turns off a public repository's schedules after 60 days without
      # activity. Each run re-enables this workflow through the API.
      actions: write
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      downloads: ${{ steps.compare.outputs.downloads }}
    steps:
      - name: Keep the schedule enabled
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/mirror.yml/enable"

      - uses: actions/checkout@v7
        with:
          repository: UnDuoMe/unduo.me
          ref: main
          path: unduo.me
          sparse-checkout: www
          persist-credentials: false

      - name: Compare www/ with unduo.me and with this mirror
        id: compare
        working-directory: unduo.me
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          # This site has no custom domain, and Pages serves no .nojekyll.
          rm -f www/CNAME www/.nojekyll

          # Prints the SHA-256 of a URL's body, or "missing".
          fetch() {
            local url=$1 body
            shift
            body=$(mktemp)
            if curl -fsS "$@" -o "$body" "${url}?mirror=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" 2>/dev/null; then
              sha256sum < "$body" | cut -d' ' -f1
            else
              echo missing
            fi
            rm -f "$body"
          }

          cd www
          echo "downloads=$(cd files && ls | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

          # Files in cdn*/ are named by their content hash and listed with their
          # SHA-256 in cdn*.json, so the other files decide whether anything changed.
          mirrored=true
          while IFS= read -r -d '' path; do
            path=${path#./}
            if [ "$(fetch "https://unduome.github.io/${path}")" != "$(sha256sum < "$path" | cut -d' ' -f1)" ]; then
              echo "This mirror serves a different ${path}."
              mirrored=false
              break
            fi
          done < <(find . -type f -not -path './cdn*/*' -print0)
          if [ "$mirrored" = true ]; then
            echo "This mirror already serves www/ from UnDuoMe/unduo.me@${commit}."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Deploy only what unduo.me serves: every file, byte for byte.
          live=true
          while IFS= read -r -d '' path; do
            path=${path#./}
            if [ "$(fetch "https://unduo.me/${path}" --retry 3 --retry-delay 5)" != "$(sha256sum < "$path" | cut -d' ' -f1)" ]; then
              echo "unduo.me serves a different ${path}."
              live=false
              break
            fi
          done < <(find . -type f -print0)
          if [ "$live" = true ]; then
            echo "Mirroring www/ from UnDuoMe/unduo.me@${commit}."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # unduo.me may still be deploying this commit. Once it has, a difference
          # means main's committed www/ isn't what unduo.me built and served.
          deployed=$(gh api "repos/UnDuoMe/unduo.me/actions/workflows/deploy.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].head_sha' 2>/dev/null) ||
            deployed=unknown
          if [ "$deployed" = "$commit" ]; then
            echo "::error::unduo.me deployed ${commit}, but serves files that differ from its committed www/. Nothing was mirrored."
            exit 1
          fi
          echo "::notice::Waiting for unduo.me to deploy ${commit} (its last successful deploy: ${deployed})."
          echo "changed=false" >> "$GITHUB_OUTPUT"

      - if: steps.compare.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: unduo.me/www

  deploy:
    name: Deploy
    needs: compare
    if: needs.compare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

      # Setup runs only from a file on the student's computer, so the site must serve
      # that file as a download, never as a page that would run.
      - name: Check the site serves the setup files as downloads
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          DOWNLOADS: ${{ needs.compare.outputs.downloads }}
        shell: bash
        run: |
          set -euo pipefail
          for file in $DOWNLOADS; do
            curl -fsSI --retry 5 --retry-all-errors --retry-delay 10 "${PAGE_URL}files/${file}" |
              grep -qi '^content-type: application/octet-stream'
          done
